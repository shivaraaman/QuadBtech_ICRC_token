[package]
name = "token_transfer_from_backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "token_transfer_from_backend"
path = "src/lib.rs"
crate-type = ["cdylib"]



[dependencies]
candid = "0.10"
ic-cdk = "0.12"
ic-cdk-timers = "0.6"
icrc-ledger-types = "0.1.5"
serde = "1.0.197"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
